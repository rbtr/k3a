#cloud-config

package_update: true
packages:
  - jq
  - curl
  - azure-cli
  - python3

write_files:
  - path: /etc/rancher/k3s/registries.yaml
    permissions: '0644'
    content: |
      mirrors:
        registry.internal:
  - path: /etc/rancher/k3s/scheduler-config.yaml
    permissions: '0644'
    content: |
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      clientConnection:
        kubeconfig: "/var/lib/rancher/k3s/server/cred/scheduler.kubeconfig"
        qps: 300
        burst: 400
      percentageOfNodesToScore: 1
      profiles:
        - schedulerName: default-scheduler
{{- if eq .Role "control-plane" }}
  - path: /usr/local/bin/update-peers.sh
    permissions: '0755'
    content: |
      #!/bin/bash

      # Variables
      DNS_ZONE_NAME="cluster.internal"
      RESOURCE_GROUP="{{ .ResourceGroup }}"
      RECORD_NAME="kubernetes"
      FULL_RECORD="${RECORD_NAME}.${DNS_ZONE_NAME}"
      INTERVAL_SECONDS=60
      
      while true; do
        echo "Collecting control-plane node IPs..."
        # Get only Ready control-plane node IPs
        CONTROL_PLANE_IPS=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o json | jq -r '.items[] | select(.status.conditions[] | select(.type=="Ready" and .status=="True")) | .status.addresses[] | select(.type=="InternalIP") | .address')
        
        # Check if record exists first
        if az network private-dns record-set a show --name "$RECORD_NAME" --zone-name "$DNS_ZONE_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
          echo "Record set exists, removing existing records..."
          # Record exists, update it instead of delete and recreate
          EXISTING_RECORD=$(az network private-dns record-set a show --name "$RECORD_NAME" --zone-name "$DNS_ZONE_NAME" --resource-group "$RESOURCE_GROUP")
          # Get existing IPs to remove them
          EXISTING_IPS=$(echo $EXISTING_RECORD | jq -r '.aRecords[] | .ipv4Address')
          
          for ip in $EXISTING_IPS; do
            echo "Removing IP $ip from record set..."
            az network private-dns record-set a remove-record \
              --ipv4-address "$ip" \
              --record-set-name "$RECORD_NAME" \
              --zone-name "$DNS_ZONE_NAME" \
              --resource-group "$RESOURCE_GROUP" || true
          done
        else
          echo "Record set does not exist, creating it..."
          # Create a new A record set
          az network private-dns record-set a create \
            --name "$RECORD_NAME" \
            --zone-name "$DNS_ZONE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --ttl 60 || true
        fi
        
        # Add each IP to the A record
        for ip in $CONTROL_PLANE_IPS; do
          echo "Adding IP $ip to record set..."
          az network private-dns record-set a add-record \
            --record-set-name "$RECORD_NAME" \
            --zone-name "$DNS_ZONE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --ipv4-address "$ip" || true
        done
        
        echo "DNS record $FULL_RECORD updated with control-plane node IPs"
    
        echo "Sleeping for $INTERVAL_SECONDS seconds..."
        sleep "$INTERVAL_SECONDS"
      done

  - path: /etc/systemd/system/k3s-update-peer.service
    permissions: '0644'
    content: |
      [Unit]
      Description=K3s Node Peer Updater
      After=network-online.target k3s.service
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/update-peers.sh
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
{{- end }}

runcmd:
  - iptables -A INPUT -p tcp --dport 6443 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 443 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 10250 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 5001 -j ACCEPT
  - iptables -A INPUT -p udp --dport 5001 -j ACCEPT
  - iptables -A INPUT -p icmp -j ACCEPT
  - iptables -A INPUT -p udp --dport 8472 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 2379 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 2380 -j ACCEPT
  - az login --identity --client-id "{{ .MSIClientID }}"
  - |
    # Determine / provision cluster token
    if [ "{{ .Role }}" = "control-plane" ]; then
      if [ -n "{{ .ClusterToken }}" ]; then
        # Cluster token provided via CLI; use directly
        CLUSTER_TOKEN='{{ .ClusterToken }}'
        echo "Using provided cluster token from CLI"
      else
        # Try to fetch existing token from Key Vault
        CLUSTER_TOKEN=$(az keyvault secret show --vault-name "{{.KeyVaultName}}" --name "k3s-cluster-token" --query value -o tsv 2>/dev/null || true)
        if [ -z "$CLUSTER_TOKEN" ]; then
          # Generate a new token (40 chars alnum)
          CLUSTER_TOKEN=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
          az keyvault secret set --vault-name "{{.KeyVaultName}}" --name "k3s-cluster-token" --value "$CLUSTER_TOKEN" >/dev/null
          echo "Generated new cluster token and stored in Key Vault"
        else
          echo "Reusing existing cluster token from Key Vault"
        fi
      fi
      echo "CLUSTER_TOKEN_READY" # marker
    else
      if [ -n "{{ .ClusterToken }}" ]; then
        CLUSTER_TOKEN='{{ .ClusterToken }}'
        echo "Worker using provided cluster token from CLI"
      else
        # Wait for token to appear in Key Vault (control-plane may still be creating it)
        for i in $(seq 1 60); do
          CLUSTER_TOKEN=$(az keyvault secret show --vault-name "{{.KeyVaultName}}" --name "k3s-cluster-token" --query value -o tsv 2>/dev/null || true)
            if [ -n "$CLUSTER_TOKEN" ]; then
              echo "Retrieved cluster token from Key Vault"
              break
            fi
            echo "Waiting for cluster token... ($i)"
            sleep 5
        done
        if [ -z "$CLUSTER_TOKEN" ]; then
          echo "ERROR: Cluster token not found after waiting" >&2
        fi
      fi
    fi
  {{- if .UsePostgres }}
  - export POSTGRES_PASSWORD=$(az keyvault secret show --vault-name "{{.KeyVaultName}}" --name "postgres-admin-password" --query value -o tsv)
  - export POSTGRES_PASSWORD_ESCAPED=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['POSTGRES_PASSWORD']))")
  {{- end }}
  - |
    {{- if eq .Role "control-plane" }}
    # Install k3s server using the synthesized cluster token
    {{- if .UsePostgres }}
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ .K8sVersion }}+k3s1" sh -s - server --token=$CLUSTER_TOKEN --tls-san {{ .ExternalIP }} --embedded-registry --cluster-cidr=16.0.0.0/5 --service-cidr=172.20.0.0/16 --kube-controller-manager-arg=node-cidr-mask-size=22 --kubelet-arg=max-pods=300 --datastore-endpoint="postgres://azureuser:${POSTGRES_PASSWORD_ESCAPED}@{{.PostgresName}}.{{.PostgresSuffix}}:5432/postgres" --etcd-disable-snapshots --disable=traefik,local-path,core-dns,metrics-server --flannel-backend=none --disable-network-policy --enable-pprof --kube-apiserver-arg=etcd-compaction-interval=0 --kube-scheduler-arg=config=/etc/rancher/k3s/scheduler-config.yaml --pause-image=mcr.microsoft.com/oss/v2/kubernetes/pause:3.10 --kube-apiserver-arg=max-requests-inflight=400 --kube-apiserver-arg=max-mutating-requests-inflight=100 --kube-controller-manager-arg=node-monitor-period=1m 
    {{- else }}
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ .K8sVersion }}+k3s1" sh -s - server --token=$CLUSTER_TOKEN --tls-san {{ .ExternalIP }} --embedded-registry --cluster-cidr=16.0.0.0/5 --service-cidr=172.20.0.0/16 --datastore-endpoint="{{ .EtcdEndpoint }}"  --kubelet-arg=max-pods=300 --etcd-disable-snapshots --disable=traefik,local-storage,coredns,metrics-server  --enable-pprof  --kube-scheduler-arg=config=/etc/rancher/k3s/scheduler-config.yaml  --pause-image=mcr.microsoft.com/oss/v2/kubernetes/pause:3.10  --kube-apiserver-arg=max-requests-inflight=400  --kube-apiserver-arg=max-mutating-requests-inflight=100 --kube-apiserver-arg=etcd-compaction-interval=0 --kube-controller-manager-arg=kube-api-qps=300 --kube-controller-manager-arg=kube-api-burst=400 --kube-controller-manager-arg=node-monitor-period=1m --kube-controller-manager-arg=node-monitor-grace-period=10m --kube-controller-manager-arg=concurrent-job-syncs=100 
    {{- end }}

    # Pre-seed DNS A record with this control-plane IP if not present yet
    if ! az network private-dns record-set a show --name kubernetes --zone-name cluster.internal --resource-group "{{ .ResourceGroup }}" >/dev/null 2>&1; then
      az network private-dns record-set a create --name kubernetes --zone-name cluster.internal --resource-group "{{ .ResourceGroup }}" --ttl 60 || true
    fi
      INTERNAL_IP=$(ip addr show eth0 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
    az network private-dns record-set a add-record --record-set-name kubernetes --zone-name cluster.internal --resource-group "{{ .ResourceGroup }}" --ipv4-address "$INTERNAL_IP" || true

    systemctl daemon-reload
    systemctl enable --now k3s-update-peer.service

    # Upload kubeconfig to Key Vault with external IP
    export KUBECONFIG_PATH="/etc/rancher/k3s/k3s.yaml"
    export KUBECONFIG_EXTERNAL_PATH="/tmp/k3s-external.yaml"
    # Wait for kubeconfig to exist
    for i in {1..30}; do
      if [ -f "$KUBECONFIG_PATH" ]; then
        # Replace 127.0.0.1:6443 with provided external IP
        sed "s#https://127.0.0.1:6443#https://{{.ExternalIP}}:6443#g" "$KUBECONFIG_PATH" > "$KUBECONFIG_EXTERNAL_PATH"
        az keyvault secret set --vault-name "{{.KeyVaultName}}" --name "kubeconfig-admin" --file "$KUBECONFIG_EXTERNAL_PATH"
        break
      fi
      sleep 2
    done

    {{- else }}
    # Worker readiness waits
    # 1. Ensure we have or retrieve cluster token
    if [ -n "{{ .ClusterToken }}" ]; then
      CLUSTER_TOKEN='{{ .ClusterToken }}'
    else
      for i in $(seq 1 60); do
        CLUSTER_TOKEN=$(az keyvault secret show --vault-name "{{.KeyVaultName}}" --name "k3s-cluster-token" --query value -o tsv 2>/dev/null || true)
        if [ -n "$CLUSTER_TOKEN" ]; then echo "Cluster token acquired"; break; fi
        sleep 5
      done
    fi
    if [ -z "$CLUSTER_TOKEN" ]; then echo "ERROR: No cluster token available" >&2; fi
    # 2. DNS resolution loop
    for i in $(seq 1 60); do
      HOST_IPS=$(getent hosts kubernetes.cluster.internal | awk '{print $1}')
      if [ -n "$HOST_IPS" ]; then echo "DNS resolved: $HOST_IPS"; break; fi
      echo "Waiting for DNS kubernetes.cluster.internal ($i)"; sleep 5
    done
    # 3. API port readiness
    TARGET_IP=$(getent hosts kubernetes.cluster.internal | head -n1 | awk '{print $1}')
    for i in $(seq 1 60); do
      (echo > /dev/tcp/$TARGET_IP/6443) >/dev/null 2>&1 && echo "API port open" && break
      echo "Waiting for API 6443 ($i)"; sleep 5
    done
    # Install agent
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ .K8sVersion }}+k3s1" sh -s - agent --token=$CLUSTER_TOKEN --server https://kubernetes.cluster.internal:6443 --kubelet-arg=max-pods=300 --pause-image=mcr.microsoft.com/oss/v2/kubernetes/pause:3.10
    
    # Wait for k3s to be ready, then label this node as worker
    while ! kubectl --kubeconfig=/var/lib/rancher/k3s/agent/kubelet.kubeconfig get nodes $(hostname) >/dev/null 2>&1; do
      echo "Waiting for node to be ready..."
      sleep 10
    done
    
    # Label this node as a worker
    kubectl --kubeconfig=/var/lib/rancher/k3s/agent/kubelet.kubeconfig label node $(hostname) node-role.kubernetes.io/worker=worker --overwrite
    sleep 5
    {{- end }}
